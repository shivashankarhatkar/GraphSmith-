[project]
name = "acme-supportos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivashankar Hatkar", email = "shivhatkar27@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
acme-supportos = "acme_supportos:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
